plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.securityandroid'
version = '0.1.0'

android {
  namespace "expo.modules.securityandroid"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // R4 amendment approved by owner 2026-10-22 (T3.1 plan D1, GATE-R4-ANDROIDX-BIOMETRIC);
  // see doc/dependencies.md section 6e and specs/tech-stack.md.
  implementation 'androidx.biometric:biometric:1.1.0'

  // R4 amendment approved by owner 2026-10-14 (T1.2); see doc/dependencies.md section 6a.
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:rules:1.7.0'
  androidTestImplementation 'androidx.test:core:1.7.0'
}
