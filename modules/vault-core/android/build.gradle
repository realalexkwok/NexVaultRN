plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vaultcore'
version = '0.1.0'

android {
  namespace "expo.modules.vaultcore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // T3.2: cross-module native gate coupling (E_VAULT_SECURITY_GATE in importMnemonic/signDigest).
  // Both local modules are autolinked projects of apps/mobile/android, so this is a project
  // reference, not a new external coordinate (zero R4 change).
  implementation project(':security-android')

  // R4 amendment approved by owner 2026-10-15 (T3.1/T1.3 GATE-R4-BC); see doc/dependencies.md §6b.
  // BouncyCastle lightweight API only — never register BouncyCastleProvider as a JCE provider.
  implementation 'org.bouncycastle:bcprov-jdk18on:1.86'

  // R4 amendment approved by owner 2026-10-14 (T1.2); see doc/dependencies.md §6a.
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:rules:1.7.0'
  androidTestImplementation 'androidx.test:core:1.7.0'
}
